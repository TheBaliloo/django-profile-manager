{% extends "base.html" %}

{% block title %}Profiles{% endblock title %}

{% block content %}
    <ul>
        {% for user in users %}
        <li>{{ user.id }} - {{ user.username }} : {{ user.email }}</li>
        <a href={% url "profile_edit" user_id=user.id %}>Edit</a>
        {% endfor %}
    </ul>

    <a href= {% url "home" %}>Home</a>
{% endblock content %}
