{% extends "base.html" %}
{% load widget_tweaks %}

{% block title %}Edit your profile{% endblock title %} 

{% block content %}
    <form action="/"  method="post">
        {% csrf_token %}

        {% if form.non_field_errors %}
        <div>
            {{ form.non_field_errors }}
        </div>
        {% endif %}

        {{form.as_p}}

        <button type="submit">Save</button>

    </form>
{% endblock content %}
